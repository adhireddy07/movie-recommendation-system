<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0d1117;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.card{
    background:#1f2937;
    border:none;
    border-radius:15px;
}

.container{
    margin-top:50px;
}

textarea{
    resize:none;
}

</style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-7">

<div class="card p-4">

<h2 class="text-center text-warning">
⭐ Movie Feedback
</h2>

<hr>

<form action="dashboard.html">

<div class="mb-3">

<label class="form-label">
Your Name
</label>

<input
type="text"
class="form-control"
placeholder="Enter your name"
required>

</div>

<div class="mb-3">

<label class="form-label">
Movie Name
</label>

<input
type="text"
class="form-control"
placeholder="Enter movie name"
required>

</div>

<div class="mb-3">

<label class="form-label">
Movie Rating
</label>

<select class="form-select">

<option>⭐⭐⭐⭐⭐ Excellent</option>
<option>⭐⭐⭐⭐ Very Good</option>
<option>⭐⭐⭐ Good</option>
<option>⭐⭐ Average</option>
<option>⭐ Poor</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Your Review
</label>

<textarea
class="form-control"
rows="5"
placeholder="Write your review here..."></textarea>

</div>

<div class="text-center">

<button class="btn btn-warning">
Submit Feedback
</button>

</div>

</form>

<hr>

<div class="text-center">

<a href="profile.html" class="btn btn-secondary">
Back to Profile
</a>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
