<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0d1117;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.card{
    background:#1f2937;
    color:white;
    border:none;
    border-radius:15px;
}

.profile-img{
    width:150px;
    height:150px;
    border-radius:50%;
    margin:auto;
    display:block;
}
.card{
    backdrop-filter:blur(15px);
    box-shadow:0 0 25px rgba(255,193,7,.25);
}

.profile-img{
    border:4px solid #ffc107;
    box-shadow:0 0 20px rgba(255,193,7,.5);
}

.table th{
    color:#ffc107;
    width:40%;
}

.table td{
    color:white;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card p-4">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
class="profile-img">

<h2 class="text-center mt-3">User Profile</h2>

<hr>

<table class="table table-dark table-bordered">

<tr>
<th>Name</th>
<td id="name"></td>
</tr>

<tr>
<th>Email</th>
<td id="email"></td>
</tr>

<tr>
<th>Age</th>
<td id="age"></td>
</tr>

<tr>
<th>Age Restriction</th>
<td id="restriction"></td>
</tr>
<tr>
<th>🎬 Movies Watched</th>
<td id="watched"></td>
</tr>

<tr>
<th>❤️ Favorite Movies</th>
<td id="favorites"></td>
</tr>

<tr>
<th>⭐ Ratings Given</th>
<td id="ratings"></td>
</tr>

<tr>
<th>▶ Last Watched</th>
<td id="lastMovie"></td>
</tr>

</table>    

</table>

<div class="text-center">

<a href="dashboard.html"
class="btn btn-warning">

Back to Dashboard

</a>

<a href="feedback.html"
class="btn btn-success">

Give Feedback

</a>

</div>

</div>

</div>

</div>

</div>
<script src="js/profile.js"></script>

</body>
</html>
