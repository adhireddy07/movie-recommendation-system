<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - CineVerse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#141414;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.navbar{
    background:black;
}

.movie-card{
    background:#222;
    border-radius:10px;

    transition:0.3s;
}

.movie-card:hover{
    transform:scale(1.05);
}

.movie-card img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:10px 10px 0 0;
}

.movie-info{
    padding:10px;
}

.search-box{
    width:300px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark px-4">

<a class="navbar-brand text-warning fw-bold" href="#">
🎬 CineVerse
</a>

<div class="d-flex">

    <input
        type="text"
        id="searchInput"
        class="form-control me-2"
        placeholder="Search any movie...">

    <button
        class="btn btn-warning"
        id="searchBtn">
        Search
    </button>

</div>



<div>

<a href="profile.html" class="btn btn-outline-light me-2">
Profile
</a>
<a href="favorites.html" class="btn btn-danger me-2">
❤️ Favorites
</a>

<a href="feedback.html" class="btn btn-warning">
Feedback
</a>

</div>

</nav>

<div class="container mt-4">

<h2 class="mb-4">
🔥 Trending Movies
</h2>

<div class="row" id="movieContainer">

</div>

</div>


<script src="js/config.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
