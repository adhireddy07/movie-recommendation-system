<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - CineVerse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0d1117;
    color:white;
    font-family:'Segoe UI',Arial,sans-serif;
}


/* Navbar */

.navbar{
    background:rgba(0,0,0,0.95);
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding:15px 25px;
}

.navbar-brand{
    font-size:28px;
    font-weight:bold;
    color:#ffc107 !important;
}

/* Search */

#searchInput{
    width:320px;
    border-radius:30px;
    background:#1f2937;
    border:1px solid #333;
    color:white;
}

#searchInput::placeholder{
    color:#aaa;
}

#searchInput:focus{
    background:#1f2937;
    color:white;
    border-color:#ffc107;
    box-shadow:0 0 12px rgba(255,193,7,.5);
}

#searchBtn{
    border-radius:30px;
    padding:0 20px;
}

/* Cards */

.card{
    background:#161b22;
    border:none;
    border-radius:18px;
    overflow:hidden;
    transition:.35s;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
    box-shadow:0 15px 35px rgba(255,193,7,.25);
}
.card{
    background:#1b1b1b;
    border:none;
    border-radius:15px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 0 25px rgba(255,193,7,0.5);
}

.card img{
    transition:0.4s;
}

.card:hover img{
    transform:scale(1.08);
}

.card-body{
    background:#1b1b1b;
}

.card-title,
.card h5{
    color:white;
}

.card p{
    color:#d0d0d0;
}

.card img{
    width:100%;
    height:340px;
    object-fit:cover;
}

.card-body{
    display:flex;
    flex-direction:column;
}

.card h5{
    color:#fff;
    font-weight:bold;
}

.card p{
    color:#ccc;
}

.card .btn{
    margin-top:auto;
    border-radius:10px;
    font-weight:bold;
}
.card{
    background:rgba(24,24,30,0.65);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    overflow:hidden;
    transition:0.35s;
    box-shadow:0 8px 25px rgba(0,0,0,0.5);
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:
        0 0 20px rgba(255,193,7,0.4),
        0 15px 35px rgba(0,0,0,0.6);
}

.card img{
    transition:0.4s;
}

.card:hover img{
    transform:scale(1.06);
}

.card-body{
    background:rgba(20,20,20,0.75);
}

/* Continue Watching */

#continueSection .card{
    background:linear-gradient(135deg,#1f2937,#111827);
}

/* Section Titles */

h2{
    color:#ffc107;
    font-weight:bold;
    margin-bottom:20px;
}

/* Buttons */

.btn-warning{
    font-weight:bold;
    border:none;
}

.btn-warning:hover{
    transform:scale(1.05);
}

/* Scroll */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#ffc107;
    border-radius:20px;
}

::-webkit-scrollbar-track{
    background:#111;
}

/* Mobile */

@media(max-width:768px){

.navbar{
    flex-direction:column;
    gap:15px;
}

.navbar .d-flex{
    width:100%;
}

#searchInput{
    width:100%;
}

.navbar div:last-child{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.card img{
    height:280px;
}

}
/* Loader */

#loader{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#0d1117;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
}

body.loaded #loader{
    display:none;
}
/* Light Theme */

body.light-mode{
    background:#f5f5f5;
    color:#111;
}

body.light-mode .navbar{
    background:#ffffff !important;
}

body.light-mode .card{
    background:#ffffff !important;
    color:#111 !important;
}

body.light-mode .card-body{
    background:#ffffff !important;
}

body.light-mode h2{
    color:#ff9800;
}

body.light-mode h5,
body.light-mode p{
    color:#111 !important;
}

body.light-mode #searchInput{
    background:#ffffff;
    color:#111;
    border:1px solid #ccc;
}

body.light-mode #searchInput::placeholder{
    color:#666;
}

</style>


</head>

<body>
 <div id="loader">

    <div class="spinner-border text-warning"
         style="width:5rem;height:5rem;"
         role="status">
    </div>

</div>   

<nav class="navbar navbar-dark px-4">

<a class="navbar-brand text-warning fw-bold" href="#">
🎬 CineVerse
</a>

<div class="d-flex">

<input
type="text"
id="searchInput"
class="form-control me-2"
placeholder="Search any movie..."
autocomplete="off">

<button
class="btn btn-warning"
id="searchBtn">
Search
</button>
<button
id="themeBtn"
class="btn btn-secondary me-2">
🌙 Dark
</button>

</div>

<div>

<a href="profile.html" class="btn btn-outline-light me-2">
Profile
</a>

<a href="favorites.html" class="btn btn-danger me-2">
❤️ Favorites
</a>

<a href="feedback.html" class="btn btn-warning">
Feedback
</a>

<a href="#" class="btn btn-danger ms-2" onclick="logout()">
Logout
</a>

</div>

</nav>

<div class="container mt-4">

<!-- Continue Watching -->

<div id="continueSection" class="mb-5" style="display:none;">

<h2 class="text-warning mb-3">
▶ Continue Watching
</h2>

<div class="card bg-dark text-white p-3">

<h4 id="continueTitle"></h4>

<button class="btn btn-warning mt-2" onclick="resumeMovie()">
Resume
</button>

</div>

</div>

<!-- Recently Watched -->

<div id="historySection" class="mb-5" style="display:none;">

<h2 class="text-warning mb-3">
🕒 Recently Watched
</h2>

<div class="row" id="historyContainer">

</div>

</div>

<!-- Recommended -->

<div id="recommendSection" class="mb-5" style="display:none;">

<h2 class="text-warning mb-3">
⭐ Recommended For You
</h2>

<div class="row" id="recommendContainer">

</div>

</div>

<!-- Trending -->

<h2 class="mb-4">
🔥 Trending Movies
</h2>

<div class="row" id="movieContainer">

</div>

</div>

<script src="js/config.js"></script>
<script src="js/restricted-movies.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
