<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - CineVerse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url("images/photo.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,Helvetica,sans-serif;

}

/* Login Card */

.card{
    width:460px;
    background:rgba(18,18,18,0.90);
    backdrop-filter:blur(12px);
    border-radius:20px;
    border:none;
    box-shadow:0 10px 35px rgba(0,0,0,.6);
}
/* Header */

.card-header{
    background:linear-gradient(90deg,#ffb300,#ff5722);
    color:white;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    padding:20px;
}

/* Body */
.card-body{

    padding:35px;

}



/* Inputs */
.form-control{
    background:#e9eefc;
    color:#000;
    border:none;
    border-radius:10px;
    height:50px;
}

.form-control::placeholder{
    color:#666;
}



.form-control:focus{

    background:rgba(255,255,255,.15);

    color:white;

    border-color:#ffc107;

    box-shadow:0 0 12px rgba(255,193,7,.45);

}
.form-label{
    color:#FFD54F;
    font-size:18px;
    font-weight:bold;
}

/* Login Button */
.btn-login{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    color:white;
    background:linear-gradient(90deg,#ffb300,#ff5722);
}

.btn-login:hover{
    background:linear-gradient(90deg,#ff9800,#ff3d00);
}

/* Links */

a{

    text-decoration:none;

}

.text-center{
    color:white;
}



.text-center{
    color:white;
}

.text-center a{
    color:#ffc107;
    font-weight:bold;
}

.text-center a:hover{
    color:#ff5722;
}

hr{

    border-color:rgba(255,255,255,.2);

}

</style>

</head>

<body>

<div class="card">

<div class="card-header">

🔐 User Login

</div>

<div class="card-body">

<form id="loginForm">

<div class="mb-3">

<label class="form-label">

Email Address

</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<input
type="password"
id="password"
class="form-control"
placeholder="Enter your password"
required>

</div>

<button
type="submit"
id="loginBtn"
class="btn btn-warning btn-login">

Login

</button>

</form>

<hr>

<div class="text-center">

<a href="#">

Forgot Password?

</a>

<br><br>

Don't have an account?

<a href="register.html">

Register Here

</a>

</div>

</div>

</div>
<script type="module" src="js/login.js"></script>


</body>
</html>
