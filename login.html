<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Movie Recommendation System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#0d1117;
            font-family:Arial,Helvetica,sans-serif;
        }

        .container{
            margin-top:80px;
        }

        .card{
            background:#1f2937;
            color:white;
            border-radius:15px;
        }

        .card-header{
            background:#ffc107;
            color:black;
            text-align:center;
            font-size:28px;
            font-weight:bold;
        }

        .btn-login{
            width:100%;
        }

        a{
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-lg">

                <div class="card-header">
                    🔐 User Login
                </div>

                <div class="card-body">

                    <form id="loginForm">

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>
                        </div>

                        <button
                            type="submit"
                            id="loginBtn"
                            class="btn btn-warning btn-login">
                            Login
                        </button>

                    </form>

                    <hr>

                    <div class="text-center">

                        <a href="#">Forgot Password?</a>

                        <br><br>

                        Don't have an account?

                        <a href="register.html">
                            Register Here
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

<script src="js/login.js"></script>

</body>
</html>
